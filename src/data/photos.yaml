ui:
  fifthRight:
    base:
      opacity: 1
      translateY: 0
      transition: none
    exit:
      translateY: -48
      transition: opacity 0.6s ease-out, transform 0.6s ease-out
    scroll:
      fadeOutStart: 1.2
      fadeOutWindow: 0.25
      moveOutPx: 40

